<ion-header class="app-header">
  <ion-toolbar>
    <ion-title>
      <span class="brand" aria-label="CONTIGO">
        <svg
          class="brand-mark"
          viewBox="0 0 36 36"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M17.6 30.7C9.2 28.9 4.8 22.1 5.9 13.4c.4-3.2 1.8-6.1 4.3-8.1 7.6 3.2 11.3 9.1 10.2 17.1-.4 3-1.3 5.8-2.8 8.3Z"
            fill="#35a8ae"
          ></path>
          <path
            d="M18.5 27.7c-1.7-8.8 2.7-16.4 12-20.2 1.8 7.8-.5 15.2-7.1 19.1-1.5.9-3.2 1.3-4.9 1.1Z"
            fill="#176b83"
          ></path>
          <path
            d="M18 31.5c.2-8.1 1.1-14.8 4.5-20.3"
            fill="none"
            stroke="#fff"
            stroke-linecap="round"
            stroke-width="1.8"
          ></path>
        </svg>
        <span>CONTIGO</span>
      </span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button
        class="profile-button"
        routerLink="/perfil"
        aria-label="Perfil"
      >
        <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
      </ion-button>
      <ion-button
        class="help-button"
        routerLink="/necesito-ayuda"
        aria-label="Necesito ayuda"
      >
        <ion-icon slot="start" name="alert-circle-outline" aria-hidden="true"></ion-icon>
        <span class="help-label">Necesito ayuda</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-router-outlet></ion-router-outlet>
  <ion-tab-bar slot="bottom" aria-label="Navegación principal">
    <ion-tab-button tab="inicio" href="/inicio" aria-label="Inicio">
      <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="bienestar" href="/bienestar" aria-label="Mi bienestar">
      <ion-icon name="heart-outline" aria-hidden="true"></ion-icon>
      <ion-label>Mi bienestar</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="plan-seguridad" href="/plan-seguridad" aria-label="Plan de seguridad">
      <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
      <ion-label>Plan</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="red-apoyo" href="/red-apoyo" aria-label="Red de apoyo">
      <ion-icon name="people-outline" aria-hidden="true"></ion-icon>
      <ion-label>Red de apoyo</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
